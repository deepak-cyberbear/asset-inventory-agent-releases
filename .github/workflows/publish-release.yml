name: Publish public release

on:
  push:
    branches:
      - incoming

permissions:
  contents: write

jobs:
  publish:
    if: github.ref == 'refs/heads/incoming'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: incoming
      - name: Validate release assets
        id: release
        shell: bash
        run: |
          set -euo pipefail
          version="$(cat VERSION)"
          if [[ ! "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release version: $version" >&2
            exit 1
          fi
          test -s vulnerability-agent-linux-amd64
          test -s vulnerability-agent-linux-arm64
          test -s install-agent-setup.tar.gz
          test -s SHA256SUMS
          sha256sum --check SHA256SUMS
          mkdir -p dist
          cp vulnerability-agent-linux-amd64 vulnerability-agent-linux-arm64 install-agent-setup.tar.gz SHA256SUMS dist/
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          assets=(
            dist/vulnerability-agent-linux-amd64
            dist/vulnerability-agent-linux-arm64
            dist/install-agent-setup.tar.gz
            dist/SHA256SUMS
          )
          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$VERSION" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$VERSION" "${assets[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --target main \
              --title "$VERSION" \
              --notes "Public Ubuntu agent binaries and installer package mirrored from the private source release $VERSION."
          fi
